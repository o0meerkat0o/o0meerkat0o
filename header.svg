<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="1000" height="200">
  <defs>
    <g id="paw">
      <ellipse cx="0" cy="6" rx="9" ry="7.5"/>
      <ellipse cx="-10.5" cy="-5" rx="3.6" ry="4.8" transform="rotate(-18 -10.5 -5)"/>
      <ellipse cx="-3.8" cy="-11.5" rx="3.6" ry="4.8" transform="rotate(-5 -3.8 -11.5)"/>
      <ellipse cx="3.8" cy="-11.5" rx="3.6" ry="4.8" transform="rotate(5 3.8 -11.5)"/>
      <ellipse cx="10.5" cy="-5" rx="3.6" ry="4.8" transform="rotate(18 10.5 -5)"/>
    </g>
  </defs>
  <!-- ears -->
  <polygon points="318,60 352,6 430,56" fill="#F9A8D4"/>
  <polygon points="336,58 355,26 398,56" fill="#FDF2F8"/>
  <polygon points="682,60 648,6 570,56" fill="#F9A8D4"/>
  <polygon points="664,58 645,26 602,56" fill="#FDF2F8"/>
  <!-- banner -->
  <rect x="0" y="44" width="1000" height="156" rx="28" fill="#FBCFE8"/>
  <!-- paws -->
  <g fill="#F9A8D4" opacity="0.7">
    <use href="#paw" transform="translate(60 160) rotate(-20) scale(1.3)"/>
    <use href="#paw" transform="translate(120 120) rotate(15) scale(1)"/>
    <use href="#paw" transform="translate(940 160) rotate(20) scale(1.3)"/>
    <use href="#paw" transform="translate(880 120) rotate(-15) scale(1)"/>
  </g>
  <!-- whiskers -->
  <g stroke="#F472B6" stroke-width="3" stroke-linecap="round" fill="none">
    <line x1="290" y1="112" x2="195" y2="98"/>
    <line x1="290" y1="128" x2="190" y2="128"/>
    <line x1="290" y1="144" x2="195" y2="158"/>
    <line x1="710" y1="112" x2="805" y2="98"/>
    <line x1="710" y1="128" x2="810" y2="128"/>
    <line x1="710" y1="144" x2="805" y2="158"/>
  </g>
  <text x="500" y="140" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI',Verdana,sans-serif" font-size="46" font-weight="700" fill="#9D174D">Hi, I'm Meira!</text>
</svg>
